name: Release

# Publishes a downloadable Unlatch.zip to GitHub Releases, then signs it into
# the Sparkle update feed on GitHub Pages. See issue #9, issue #13,
# Design/sparkle-updates.md, and RELEASING.md's "Distribution and signing"
# section.
#
# Job chain on a tag push:
#   build-and-package -> publish -> appcast -> deploy-feed
# `appcast` (macOS, holds the Sparkle signing key) and `deploy-feed` (Pages)
# run after `publish` so the feed never points at an asset that does not exist
# yet. If either fails, the release exists but is not announced in the app;
# re-running the failed jobs is safe.
#
# Triggers:
#   - A pushed `v*` tag (the real release path). Only this path publishes.
#   - workflow_dispatch, to exercise build/package/verify on a branch without
#     a tag. This trigger never publishes: the `publish` job is gated to
#     `github.event_name == 'push'` unconditionally, because a manual
#     dispatch has no tag to attach a release to. There is no separate
#     dry-run input - dispatching this workflow IS the dry run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# One release run per tag (or per branch, for a manual dry run) at a time.
# Unlike ci.yml this does not cancel an in-progress run: a half-finished
# publish is worse than a queued duplicate, and a given tag is only ever
# pushed once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Same pinned toolchain as ci.yml (see that file's comment for the
  # rationale and the macos-26 fallback).
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  # Ad-hoc only for now: no paid Apple Developer Program membership yet
  # (decision recorded in issue #8; see RELEASING.md's "Distribution and
  # signing"). Scripts/package-app.sh reads this single value and defaults
  # to "-" itself, but it is set explicitly here so the seam is visible.
  # Issue #8 will change this to a "Developer ID Application: Name (TEAMID)"
  # identity read from a repository secret, add a keychain-import step
  # before "Build and package" and a notarize step after "Verify", and
  # delete a temporary keychain in an always() step - not rewrite this
  # workflow.
  SIGN_IDENTITY: '-'

jobs:
  build-and-package:
    name: build-and-package
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      # First step, matching ci.yml: if anything below fails, the log
      # immediately shows which Xcode/Swift toolchain was actually in effect.
      - name: Print Swift version
        run: swift --version

      # fetch-depth: 0 is required, not optional: Scripts/package-app.sh
      # derives CFBundleShortVersionString from `git describe --tags` and
      # CFBundleVersion from `git rev-list --count HEAD`. The default
      # shallow, tagless checkout makes both meaningless and silently
      # produces a 0.0.0-<sha> dev build instead of the tagged version.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Builds, bundles, ad-hoc signs, and zips. All of that logic lives in
      # the script (issue #7); this workflow does not duplicate it.
      - name: Build and package
        run: Scripts/package-app.sh
        env:
          SIGN_IDENTITY: ${{ env.SIGN_IDENTITY }}

      # A failure here must fail the job rather than publish an unusable
      # build. package-app.sh already runs this same check right after
      # signing, but it is repeated here as the workflow's own gate, and
      # extended to also assert the signature is ad-hoc (no Developer ID
      # authority, which would mean SIGN_IDENTITY changed without
      # RELEASING.md being updated to match).
      - name: Verify signature
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 dist/Unlatch.app

          DV_OUTPUT="$(codesign -dv dist/Unlatch.app 2>&1)"
          echo "$DV_OUTPUT"
          if ! grep -q '^Signature=adhoc$' <<<"$DV_OUTPUT"; then
            echo "::error::expected an ad-hoc signature (Signature=adhoc); codesign -dv did not report one" >&2
            exit 1
          fi
          if grep -q '^Authority=' <<<"$DV_OUTPUT"; then
            echo "::error::found an Authority= line on an ad-hoc build; SIGN_IDENTITY may have changed without RELEASING.md being updated" >&2
            exit 1
          fi

      # Sparkle bundle checks (issue #13, Design/sparkle-updates.md section
      # 2.8). Conditional on the binary linking Sparkle (package-app.sh embeds the
      # framework exactly then), so this passes on a build without Sparkle but
      # fails if the binary links it and the framework is missing. `--deep --strict` alone would accept Sparkle's own vendor
      # signatures (adhoc + runtime), so each nested item is checked on its own:
      # ad-hoc, no Authority, and no `runtime` flag, which would turn on library
      # validation and stop dyld from loading the framework. Issue #8 flips the
      # Authority and runtime assertions here.
      - name: Verify Sparkle bundle
        run: |
          set -euo pipefail
          APP=dist/Unlatch.app
          FW="$APP/Contents/Frameworks/Sparkle.framework"
          # Skip only when the binary does not link Sparkle. Capture the output
          # first: `otool | grep -q` under pipefail fails intermittently.
          LINKED_LIBS="$(otool -L "$APP/Contents/MacOS/Unlatch")"
          if ! grep -q '@rpath/Sparkle.framework/' <<<"$LINKED_LIBS"; then
            echo "Binary does not link Sparkle; skipping Sparkle checks"
            exit 0
          fi
          if [[ ! -d "$FW" ]]; then
            echo "::error::Unlatch links Sparkle.framework but it is not embedded at $FW" >&2
            exit 1
          fi
          # -L as well as -e: a dangling symlink counts as present.
          if [[ -e "$FW/XPCServices" || -L "$FW/XPCServices" || -e "$FW/Versions/B/XPCServices" || -L "$FW/Versions/B/XPCServices" ]]; then
            echo "::error::Sparkle XPCServices must be removed from the bundle" >&2
            exit 1
          fi
          for ITEM in "$FW" "$FW/Versions/B/Autoupdate" "$FW/Versions/B/Updater.app"; do
            echo "--- $ITEM"
            codesign --verify --strict "$ITEM"
            DV="$(codesign -dv "$ITEM" 2>&1)"
            echo "$DV"
            if ! grep -q '^Signature=adhoc$' <<<"$DV"; then
              echo "::error::$ITEM is not ad-hoc signed" >&2
              exit 1
            fi
            if grep -q '^Authority=' <<<"$DV"; then
              echo "::error::$ITEM has an Authority= line on an ad-hoc build" >&2
              exit 1
            fi
            FLAGS_LINE="$(grep -E '^CodeDirectory .*flags=' <<<"$DV" || true)"
            if grep -q 'runtime' <<<"$FLAGS_LINE"; then
              echo "::error::$ITEM carries the hardened runtime flag; a vendor signature was not replaced" >&2
              exit 1
            fi
          done
          PLIST="$APP/Contents/Info.plist"
          FEED="$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$PLIST" 2>/dev/null || true)"
          KEY="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$PLIST" 2>/dev/null || true)"
          [[ -n "$FEED" ]] || { echo "::error::SUFeedURL is missing from Info.plist" >&2; exit 1; }
          [[ -n "$KEY" ]] || { echo "::error::SUPublicEDKey is missing or empty in Info.plist" >&2; exit 1; }
          [[ "$FEED" == https://* ]] || { echo "::error::SUFeedURL is not an https URL: '$FEED'" >&2; exit 1; }
          if /usr/libexec/PlistBuddy -c 'Print :SUEnableInstallerLauncherService' "$PLIST" >/dev/null 2>&1; then
            echo "::error::SUEnableInstallerLauncherService must not be set (app is not sandboxed)" >&2
            exit 1
          fi

      # Only meaningful for a real tag push: workflow_dispatch runs against
      # a branch, which has no tag, so package-app.sh falls back to its
      # 0.0.0-<sha> dev version and there is nothing to compare it against.
      - name: Verify version matches tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED="${TAG#v}"
          ACTUAL="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Unlatch.app/Contents/Info.plist)"
          echo "tag=$TAG expected-version=$EXPECTED actual-version=$ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Info.plist CFBundleShortVersionString ($ACTUAL) does not match the tag ($EXPECTED). fetch-depth may be wrong, or the tag is not an exact 'git describe' match." >&2
            exit 1
          fi

      # dist/Unlatch.zip is what package-app.sh produced with `ditto -c -k
      # --sequesterRsrc --keepParent`. Confirm the signature actually survives an unzip
      # round-trip - the same check anyone downloading the release will
      # implicitly rely on - rather than only trusting the pre-zip bundle.
      - name: Verify zip round-trip
        run: |
          set -euo pipefail
          ROUNDTRIP_DIR="$(mktemp -d)"
          ditto -x -k dist/Unlatch.zip "$ROUNDTRIP_DIR"
          codesign --verify --deep --strict --verbose=2 "$ROUNDTRIP_DIR/Unlatch.app"

          # Launch check on the round-tripped copy, which is what users get.
          # A missing or unloadable embedded framework makes dyld abort at
          # once ("Library not loaded: @rpath/Sparkle.framework/..."), so a
          # process still alive after 5 s means the app loaded. Sparkle makes
          # no network request on a first launch. If hosted runners cannot
          # sustain a GUI process, replace this with a static check (otool -l
          # shows the @executable_path/../Frameworks rpath and
          # Versions/B/Sparkle exists) and record the reason here.
          "$ROUNDTRIP_DIR/Unlatch.app/Contents/MacOS/Unlatch" &
          APP_PID=$!
          sleep 5
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            wait "$APP_PID" || echo "exit status: $?"
            echo "::error::Unlatch exited within 5 seconds of launch (dyld failure?)" >&2
            exit 1
          fi
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          rm -rf "$ROUNDTRIP_DIR"

      - name: Upload Unlatch.zip
        uses: actions/upload-artifact@v7
        with:
          name: unlatch-zip
          path: dist/Unlatch.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build-and-package
    # Only a real tag push publishes. A workflow_dispatch run never has a
    # tag to attach a release to, so it always stops after verification.
    # `appcast` and `deploy-feed` below are gated the same way and run only
    # after this job succeeds.
    if: github.event_name == 'push'
    # No Swift/Xcode toolchain needed here - just downloading an artifact
    # and calling gh - so this runs on a Linux runner rather than the
    # macOS/Xcode runner build-and-package needs, which costs 10x the
    # Actions minutes.
    #
    # Pinned to ubuntu-24.04 rather than ubuntu-latest (issue #37):
    # ubuntu-latest migrates to Ubuntu 26.04 in a rollout from 2026-10-19 to
    # about 2026-11-19, so a release in that window could land on either
    # image, and this job is the irreversible last step of a release.
    # Nothing here needs a newer image
    # (it only downloads an artifact and runs the preinstalled gh), so the
    # pin trades nothing for protection against an image change landing on
    # release day. Revisit before ubuntu-24.04 itself is deprecated.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # upload-artifact@v7 and download-artifact@v8 are bumped together and
      # keep the default zipped archive, so v8 still unzips it and the file
      # lands at dist/Unlatch.zip. v8 fails on a digest mismatch by default.
      - name: Download Unlatch.zip
        uses: actions/download-artifact@v8
        with:
          name: unlatch-zip
          path: dist

      # No checkout in this job, so gh has no local git repository to infer
      # the target repo from: GH_REPO makes that explicit rather than
      # relying on gh failing to resolve it. --generate-notes still works
      # with no checkout - it reads .github/release.yml and the merged PRs
      # to build notes entirely through the GitHub API, keyed off GH_REPO
      # and the tag, not off a local working tree. Prerelease status is
      # derived from the tag per RELEASING.md's versioning rules:
      # vX.Y.Z-beta.N tags publish as prereleases, plain vX.Y.Z tags do not.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          ARGS=(--title "Unlatch $TAG" --generate-notes)
          if [[ "$TAG" == *-beta.* ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" dist/Unlatch.zip "${ARGS[@]}"

  # Signs the published zip and adds it to the update feed (issue #13). Kept
  # out of build-and-package on purpose: that job runs `swift build` and so
  # third-party package manifests, and the private key must only be exposed to
  # a job that runs no such code. macOS because Sparkle's tools are macOS-only.
  appcast:
    name: appcast
    needs: publish
    if: github.event_name == 'push'
    runs-on: xcode-27
    timeout-minutes: 15
    # The secret SPARKLE_ED_PRIVATE_KEY lives in this environment, which is
    # restricted to v* tags.
    environment: sparkle-signing
    permissions:
      contents: read
    # Serializes feed updates across tags (the workflow-level group is per
    # ref and does not).
    concurrency:
      group: appcast
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Sparkle's generate_appcast comes from the SwiftPM binary artifact
      # pinned in Package.resolved; no second version pin lives here.
      - name: Resolve packages
        run: swift package resolve

      - name: Download Unlatch.zip
        uses: actions/download-artifact@v8
        with:
          name: unlatch-zip
          path: dist

      # Same notes as the release page, so there is one source of truth.
      # generate_appcast pairs Unlatch.md with Unlatch.zip by base name.
      - name: Fetch release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" --json body --jq .body > notes.raw
          grep -v '^<!-- Release notes generated' notes.raw > notes.md || true
          mkdir -p dist
          cp notes.md dist/Unlatch.md

      # A Pages deploy replaces the whole site, so start from the live feed.
      # 200: use it. 404: first release, start a new feed. Anything else
      # fails the job: a transient error must never quietly reset the feed.
      - name: Fetch current feed
        run: |
          set -euo pipefail
          # The feed URL the shipped app polls, read from the built bundle.
          UNZIP_DIR="$(mktemp -d)"
          ditto -x -k dist/Unlatch.zip "$UNZIP_DIR"
          FEED_URL="$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$UNZIP_DIR/Unlatch.app/Contents/Info.plist")"
          rm -rf "$UNZIP_DIR"
          STATUS="$(curl -sS -o current-appcast.xml -w '%{http_code}' "$FEED_URL?cb=$(date +%s)")"
          echo "GET $FEED_URL -> $STATUS"
          case "$STATUS" in
            200) echo "CURRENT_FEED=current-appcast.xml" >> "$GITHUB_ENV" ;;
            404)
              echo "::warning::No published feed at $FEED_URL (404); starting a new one. Expected on the first Sparkle release."
              echo "CURRENT_FEED=" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unexpected HTTP status $STATUS fetching $FEED_URL" >&2
              exit 1
              ;;
          esac

      # The key is passed through the environment and piped to the tools on
      # stdin by the script. Never add `set -x` or echo it here.
      - name: Update appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          Scripts/update-appcast.sh \
            --zip dist/Unlatch.zip \
            --notes dist/Unlatch.md \
            --tag "$TAG" \
            --current-feed "$CURRENT_FEED" \
            --out appcast-out

      - name: Upload appcast
        uses: actions/upload-artifact@v7
        with:
          name: appcast
          path: appcast-out/appcast.xml
          if-no-files-found: error
          retention-days: 7

  # Deploys the feed with GitHub Pages (Actions-based, not a gh-pages
  # branch). Separate Linux job because upload-pages-artifact tars with GNU
  # tar flags.
  deploy-feed:
    name: deploy-feed
    needs: appcast
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download appcast
        uses: actions/download-artifact@v8
        with:
          name: appcast
          path: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
