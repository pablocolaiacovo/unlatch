name: CI

# Every PR into main and every push to main must prove the package still builds and
# its tests still pass on a machine that isn't the maintainer's laptop. See issue #2.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel a stale run when new commits land on the same ref, so pushing twice to a PR
# (or to main) never queues two full builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to a specific Xcode on the macos-26 image rather than trusting whatever the
  # image's default happens to be, so a runner-image update can't silently change the
  # toolchain under us. Package.swift declares swift-tools-version: 6.3 and
  # swiftLanguageModes: [.v6], which an older toolchain can't even parse.
  #
  # Per the actions/runner-images macos-26 readme, Xcode 26.4 was the first version to
  # ship Swift 6.3; Xcode 26.6 (build 17F113) is the current default on this image and
  # also ships Swift 6.3, so it's the one pinned here. Bump this (and re-check the
  # image's README for the installed path) when a newer Xcode is needed.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build-and-test:
    name: build-and-test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # First step, per the issue: if anything below fails, the log immediately shows
      # which Xcode/Swift toolchain was actually in effect.
      - name: Print Swift version
        run: swift --version

      - name: Checkout
        uses: actions/checkout@v7

      # UnlatchCore has zero external dependencies today, so no Package.resolved is
      # committed and hashFiles() simply finds nothing to hash for that glob. Package.swift
      # is included too, so the key still changes if the manifest itself changes, and the
      # day a dependency (and a real Package.resolved) is added, it's picked up
      # automatically without touching this file. The Xcode/Swift version above is baked
      # into the key by hand since it isn't derived from any file in the repo.
      - name: Cache .build
        uses: actions/cache@v6
        with:
          path: .build
          key: macos-26-xcode26.6-spm-${{ hashFiles('**/Package.resolved', 'Package.swift') }}
          restore-keys: |
            macos-26-xcode26.6-spm-

      - name: Build
        run: swift build

      - name: Test
        run: swift test
