name: CI

# Every PR into main and every push to main must prove the package still builds and
# its tests still pass on a machine that isn't the maintainer's laptop. See issue #2.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel a stale run when new commits land on the same ref, so pushing twice to a PR
# (or to main) never queues two full builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to a specific Xcode on the xcode-27 image rather than trusting whatever the
  # image's default happens to be, so a runner-image update can't silently change the
  # toolchain under us. Package.swift declares swift-tools-version: 6.3 and
  # swiftLanguageModes: [.v6], which an older toolchain can't even parse.
  #
  # Per the actions/runner-images xcode-27-arm64 readme, this image ships a single
  # Xcode: 27.0, build 27A266a, matching the maintainer's local Xcode 27.0 (27A266a) /
  # Swift 6.4. The image installs it at /Applications/Xcode_27_Release_Candidate.app,
  # with /Applications/Xcode_27.0.app as a stable alias to that same build, and
  # /Applications/Xcode.app as the (mutable) default symlink; this pins the 27.0 alias
  # rather than the default so a future image update can't silently repoint us. Bump
  # this (and re-check the image's README for the installed path) when a newer Xcode
  # is needed.
  #
  # The xcode-27 runner image is in public preview (macOS 27, arm64 only) as of the
  # 2026-09-10 GitHub changelog announcement. If preview instability shows up here
  # (queue times, flaky toolchain behavior, image churn), fall back to runs-on: macos-26
  # with DEVELOPER_DIR pinned to /Applications/Xcode_26.6.app/Contents/Developer, which
  # is the last known-good pin (see git history of this file).
  #
  # Changing DEVELOPER_DIR or runs-on requires a full snapshot re-record (RELEASING.md,
  # "Snapshot tests"). Keep both identical to record-snapshots.yml, which must record on
  # the same toolchain and image that this workflow verifies on.
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  build-and-test:
    name: build-and-test
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      # First step, per the issue: if anything below fails, the log immediately shows
      # which Xcode/Swift toolchain was actually in effect.
      - name: Print Swift version
        run: swift --version

      - name: Checkout
        uses: actions/checkout@v7

      # Package.resolved is committed: it pins Sparkle and the test-only snapshot packages.
      # Package.swift is hashed too, so the key also changes if the manifest itself changes.
      # The glob is **/Package.resolved, so a changed pin (a dependency bump) produces a
      # new key and a cold cache on its first run. The Xcode/Swift version above is baked
      # into the key by hand since it isn't derived from any file in the repo.
      # The "-release" segment marks a cache that also holds .build/release. actions/cache
      # never re-saves on an exact key hit, so the prefix was changed once to make the
      # first run after the release test build was added save a cache containing it. The
      # second restore key still restores the older debug-only cache on that first run, so
      # it isn't fully cold.
      - name: Cache .build
        uses: actions/cache@v6
        with:
          path: .build
          key: macos-27-xcode27.0-spm-release-${{ hashFiles('**/Package.resolved', 'Package.swift') }}
          restore-keys: |
            macos-27-xcode27.0-spm-release-
            macos-27-xcode27.0-spm-

      - name: Build
        run: swift build

      # The string catalog must match the strings the code uses (Design/spanish-localization.md,
      # section 2.10). The script re-syncs Localizable.xcstrings from the .stringsdata the
      # debug build emits; any diff means the code and the catalog disagree. No second full
      # build: plain `swift build` already uses Swift Build (the same engine and debug
      # configuration the script asks for), so the script's own build step is a no-op after
      # "Build". Keep this step directly after "Build" and keep the script's build flags in
      # step with it, or this turns into a duplicate build.
      - name: Check string catalog
        run: |
          Scripts/sync-strings.sh
          if ! git diff --exit-code -- Sources/Unlatch/Resources/Localizable.xcstrings; then
            echo "::error file=Sources/Unlatch/Resources/Localizable.xcstrings::The string catalog does not match the strings in the code. Run Scripts/sync-strings.sh locally, translate the new entries (Spanish) in Localizable.xcstrings, and commit the catalog."
            exit 1
          fi

      # UNLATCH_SNAPSHOTS=require runs the popover snapshot suite unconditionally (locally it
      # is gated on the rendering environment). SNAPSHOT_TESTING_RECORD=failed makes a
      # mismatched or missing reference get (re)written in the runner's workspace while
      # still failing the test, so this required check stays red until a human commits the
      # images. SNAPSHOT_ARTIFACTS is where the library writes the failing renders.
      - name: Test
        id: test
        env:
          UNLATCH_SNAPSHOTS: require
          SNAPSHOT_TESTING_RECORD: failed
          SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshots/failures
        run: swift test

      # Compile-only check of the package and its test targets in release configuration, so
      # code that builds in debug but breaks only in release (see #69, #73) fails the PR that
      # causes it. After Test so a snapshot failure still reaches the collect/upload steps
      # below. It deliberately doesn't run after a Test failure, which is already red.
      # Doesn't run the tests. -enable-testing is what `swift test -c release` adds on its
      # own; without it the tests' @testable imports don't resolve in a plain release build.
      - name: Build tests (release)
        run: swift build -c release --build-tests -Xswiftc -enable-testing

      # Both snapshot directories go under one root in runner.temp so the artifact has a
      # stable layout (failures/ and recorded/). Passing a workspace path and a temp path
      # to upload-artifact together would root the layout at /. Only when Test failed: a
      # release-only failure has no new snapshots worth uploading.
      - name: Collect snapshots
        if: failure() && steps.test.outcome == 'failure'
        run: |
          mkdir -p "${{ runner.temp }}/snapshots"
          if [ -d Tests/UnlatchTests/__Snapshots__ ]; then
            cp -R Tests/UnlatchTests/__Snapshots__ "${{ runner.temp }}/snapshots/recorded"
          fi

      # The run attempt is in the name so a re-run never collides with the first attempt's
      # artifact. if-no-files-found: ignore because a compile failure produces no snapshots.
      - name: Upload snapshots
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: popover-snapshots-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
          retention-days: 14

      # The tests rewrite RECORDED_ON.txt in CI. A diff here on a green run means the runner's
      # macOS changed but the pixels still matched within tolerance. A nudge to run the
      # "Record snapshots" workflow, not a failure.
      - name: Warn when the snapshot environment changed
        if: success()
        run: |
          if [ -n "$(git status --porcelain -- Tests/UnlatchTests/__Snapshots__/RECORDED_ON.txt)" ]; then
            echo "::warning title=Snapshot environment changed::The runner's rendering environment differs from the one the committed snapshots were recorded in. The snapshots still pass within tolerance. Run the 'Record snapshots' workflow and commit the result to re-baseline."
          fi
